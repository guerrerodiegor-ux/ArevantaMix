<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezclas Drone</title>
<meta name="theme-color" content="#0f3d5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mezclas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#eef3f7;--surface:#fff;--surface2:#e5edf3;--border:#c6d4df;--text:#132232;--text2:#55687a;--accent:#0d6efd;--accent2:#0f7b6c;--warn:#b26a00;--danger:#c62828;--ok:#1e7e45;--input:#f8fbfd;--radius:10px;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
body.oscuro{--bg:#0b1622;--surface:#112233;--surface2:#183049;--border:#24425f;--text:#e7eef5;--text2:#8ea5ba;--accent:#5aa2ff;--accent2:#3fc1a9;--warn:#f0a83a;--danger:#ef6461;--ok:#4caf50;--input:#0d1b2a;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;min-height:100vh;}
header{background:#0f3d5c;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
header img.logo{height:36px;width:auto;background:#fff;border-radius:8px;padding:4px 7px;flex:none;}
.ht{flex:1;min-width:0;}.ht h1{font-size:16px;}.ht p{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-tema{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;}
nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:19;}
nav button{flex:1;background:none;border:none;border-bottom:3px solid transparent;padding:11px 4px;font-size:14px;font-weight:700;color:var(--text2);cursor:pointer;}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);}
main{padding:12px;max-width:760px;margin:0 auto;}
section{display:none;}section.on{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.card h3{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;font-weight:800;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0;}
.field label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.field input,.field select{background:var(--input);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:10px;font-size:16px;font-family:inherit;width:100%;min-width:0;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.big input{font-size:22px;font-weight:800;font-family:var(--mono);text-align:center;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.chip{border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;}
.chip.on{border-color:var(--accent2);background:rgba(15,123,108,.12);color:var(--accent2);}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px;}
.seg button{flex:1;padding:9px;border:none;background:var(--surface);color:var(--text2);font-weight:700;font-size:13px;cursor:pointer;}
.seg button.on{background:var(--accent2);color:#fff;}
.prod{border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:10px;background:var(--surface2);}
.prod .top{display:flex;gap:8px;align-items:flex-end;}
.prod .top .field{flex:1;margin-bottom:8px;}
.prod .num{display:inline-block;background:var(--accent2);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;font-weight:800;font-size:13px;flex:none;margin-bottom:16px;}
.prod .field{margin-bottom:8px;}
.x{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;padding:4px 6px;margin-bottom:12px;}
.btn{border:none;border-radius:8px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);}
.btn.full{width:100%;}.btn.ok{background:var(--ok);}.btn.wa{background:#1fa855;}.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn.danger{background:var(--danger);}
.btns{display:flex;gap:8px;flex-wrap:wrap;}.btns .btn{flex:1;min-width:120px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center;}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--accent2);}
.kpi .l{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.aviso{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;border:1px solid;}
.aviso.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.55);color:var(--warn);}
.aviso.err{background:rgba(224,85,85,.08);border-color:rgba(224,85,85,.5);color:var(--danger);}
.aviso.info{background:rgba(13,110,253,.06);border-color:rgba(13,110,253,.35);color:var(--text);}
.tw{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;}
table{width:100%;border-collapse:collapse;}
th{background:var(--surface2);padding:8px;font-size:10px;text-transform:uppercase;color:var(--text2);text-align:left;white-space:nowrap;}
td{padding:9px 8px;border-top:1px solid var(--border);font-size:14px;}
td.n{font-family:var(--mono);text-align:right;font-weight:700;white-space:nowrap;}
.hoja{border:2px solid var(--accent2);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--surface);}
.hoja h4{font-size:16px;margin-bottom:2px;}
.hoja .sub{color:var(--text2);font-size:13px;margin-bottom:10px;}
.paso{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--border);}
.paso:first-of-type{border-top:none;}
.paso .o{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--text2);}
.paso .t{flex:1;min-width:0;}
.paso .t small{display:block;color:var(--text2);font-size:11px;}
.paso .q{font-family:var(--mono);font-weight:900;font-size:20px;white-space:nowrap;color:var(--accent2);}
.paso.agua .q{color:var(--accent);}
.prog{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);align-items:center;}
.prog span{font-size:12px;color:var(--text2);margin-right:4px;}
.mx{min-width:40px;padding:7px 9px;border:2px solid var(--border);border-radius:8px;background:var(--surface);font-weight:800;cursor:pointer;color:var(--text);}
.mx.done{background:var(--ok);border-color:var(--ok);color:#fff;text-decoration:line-through;}
.vcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;}
.vcard .t{font-weight:800;}.vcard .d{font-size:12px;color:var(--text2);margin:2px 0 8px;}
.vcard .btns .btn{padding:8px 10px;font-size:13px;min-width:80px;}
.muted{color:var(--text2);font-size:12px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;transition:transform .25s;z-index:99;max-width:92vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.foot{text-align:center;color:var(--text2);font-size:11px;padding:16px 0 30px;}
@media(max-width:420px){.g3{grid-template-columns:1fr 1fr;}}
@media print{header,nav,#s-calc>.card,.no-print,.prog,.toast{display:none!important;}section{display:none!important;}#s-calc{display:block!important;}body,html{background:#fff;}.hoja{break-inside:avoid;}#print-head{display:block!important;}}
</style>
</head>
<body>
<header>
  <img src="logo-arevanta.png" alt="Arevanta" class="logo">
  <div class="ht"><h1>Mezclas Drone</h1><p id="h-sub">Calculadora de caldo por mixer</p></div>
  <button class="btn-tema" id="btn-tema" onclick="toggleTema()"></button>
</header>
<nav>
  <button data-s="calc" class="on" onclick="ir('calc')">Calcular</button>
  <button data-s="trab" onclick="ir('trab')">Trabajos</button>
  <button data-s="prod" onclick="ir('prod')">Productos</button>
  <button data-s="cfg" onclick="ir('cfg')">Ajustes</button>
</nav>
<main>
<section id="s-calc" class="on">
  <div class="card">
    <h3>Trabajo</h3>
    <div class="g2">
      <div class="field"><label>Cliente / lote</label><input id="f-lote" oninput="cambio()"></div>
      <div class="field"><label>Cultivo</label><input id="f-cultivo" oninput="cambio()"></div>
    </div>
    <div class="g2">
      <div class="field"><label>Fecha</label><input type="date" id="f-fecha" oninput="cambio()"></div>
      <div class="field"><label>Objetivo</label><input id="f-obj" placeholder="Ej: insecticida trips" oninput="cambio()"></div>
    </div>
  </div>
  <div class="card">
    <h3>Aplicación</h3>
    <div class="g2 big">
      <div class="field"><label>Hectáreas</label><input id="f-ha" inputmode="decimal" placeholder="0" oninput="cambio()"></div>
      <div class="field"><label>Caudal (L/ha)</label><input id="f-caudal" inputmode="decimal" placeholder="0" oninput="cambio()"></div>
    </div>
    <div class="field"><label>Mixer</label></div>
    <div class="chips" id="f-equipos"></div>
    <div class="field" id="f-otro-box" style="display:none"><label>Capacidad del mixer (L)</label><input id="f-mixer-otro" inputmode="decimal" oninput="cambio()"></div>
    <div class="g3">
      <div class="field"><label>Tanque drone (L)</label><input id="f-tanque" inputmode="decimal" oninput="cambio()"></div>
      <div class="field"><label>Sobrante (%)</label><input id="f-sob" inputmode="decimal" placeholder="0" oninput="cambio()"></div>
      <div class="field"><label>Rendim. (ha/h)</label><input id="f-rend" inputmode="decimal" placeholder="Opcional" oninput="cambio()"></div>
    </div>
    <div class="field"><label>Cómo repartir el caldo</label></div>
    <div class="seg" id="f-modo">
      <button data-m="llenos" onclick="setModo('llenos')">Mixers llenos + último parcial</button>
      <button data-m="iguales" onclick="setModo('iguales')">Todas las cargas iguales</button>
    </div>
  </div>
  <div class="card">
    <h3>Productos</h3>
    <div id="f-prods"></div>
    <datalist id="dl-prods"></datalist>
    <button class="btn sec full" onclick="addProd()">+ Agregar producto</button>
  </div>
  <div id="resultado"></div>
  <div class="btns no-print" style="margin-bottom:14px">
    <button class="btn wa" onclick="compartir()">Enviar por WhatsApp</button>
    <button class="btn ok" onclick="guardarTrabajo()">Guardar trabajo</button>
  </div>
  <div class="btns no-print">
    <button class="btn sec" onclick="window.print()">Imprimir / PDF</button>
    <button class="btn sec" onclick="copiar()">Copiar texto</button>
    <button class="btn sec" onclick="nuevo()">Nuevo cálculo</button>
  </div>
  <div id="print-head" style="display:none"></div>
</section>
<section id="s-trab"></section>
<section id="s-prod"></section>
<section id="s-cfg"></section>
<div class="foot">Mezclas Drone · los datos se guardan en este dispositivo</div>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="file-restore" accept=".json,application/json" style="display:none" onchange="restaurar(this)">
<script>
'use strict';
/* ================= DATOS ================= */
var KEY='mezclas_drone_v1';
var UNIDADES=[['L/ha','L/ha'],['ml/ha','ml/ha (cc/ha)'],['kg/ha','kg/ha'],['g/ha','g/ha'],['ml/100L','ml cada 100 L de caldo'],['%v/v','% v/v del caldo']];
var TIPOS=[['corrector','Corrector pH / secuestrante / antiespumante',1],['WG','Polvo o granulado (WG, WP, DF, SP)',2],['SC','Suspensión (SC, CS, SE)',3],['EC','Emulsionable o aceitoso (EC, EW, OD, ME)',4],['SL','Soluble (SL, SG)',5],['fol','Fertilizante foliar',6],['ady','Adyuvante / aceite / tensioactivo',7],['otro','Otro / no sé',5.5]];
var D;
function nuevoDraft(){return {lote:'',cultivo:'',obj:'',fecha:hoy(),ha:'',caudal:'',equipo:(D&&D.cfg.equipos[0]||{}).id||'e500',mixerOtro:'',tanque:'',sob:'',rend:'',modo:'llenos',prods:[nuevoProd()],hechos:[]};}
function nuevoProd(){return {nombre:'',dosis:'',unidad:'L/ha',tipo:'otro',envase:'',envUni:'L'};}
function base(){return {cfg:{empresa:'Arevanta',equipos:[{id:'e300',nombre:'Mixer 300 L',mixer:300,tanque:40},{id:'e500',nombre:'Mixer 500 L',mixer:500,tanque:40}],sob:0},lib:[],trabajos:[],actual:null,tema:'claro',seq:1};}
function cargar(){var b=base();try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)for(var k in s)b[k]=s[k];}catch(e){}D=b;if(!D.actual)D.actual=nuevoDraft();}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('No se pudo guardar',1);}}

/* ================= UTILIDADES ================= */
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function p2(n){return String(n).padStart(2,'0');}
function hoy(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function isoAR(i){if(!i)return '';var p=i.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function num(v){if(v===''||v==null)return '';var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?'':n;}
function fN(x,d){return Number(x).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fAuto(x){var a=Math.abs(x);return Number(x).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:a>=100?0:a>=10?1:2});}
function esSolido(u){return u==='kg/ha'||u==='g/ha';}
function fCant(x,sol){ // x en ml o g
  var f=function(v,d){return Number(v).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:d});};
  if(Math.abs(x)>=1000)return f(x/1000,x>=100000?1:2)+(sol?' kg':' L');
  return f(x,x<10?1:0)+(sol?' g':' ml');
}
function toast(m,err){var t=$('toast');t.textContent=m;t.style.background=err?'var(--danger)':'var(--ok)';t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show');},2600);}
function tipoOrden(t){var x=TIPOS.find(function(y){return y[0]===t;});return x?x[2]:5.5;}
function tipoTxt(t){var x=TIPOS.find(function(y){return y[0]===t;});return x?x[1]:'';}
function opts(L,sel){return L.map(function(x){var v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(t)+'</option>';}).join('');}

/* ================= CÁLCULO ================= */
function equipoSel(A){return D.cfg.equipos.find(function(e){return e.id===A.equipo;});}
function capMixer(A){if(A.equipo==='otro')return num(A.mixerOtro);var e=equipoSel(A);return e?+e.mixer:'';}
// ml o g de producto por litro de caldo
function concL(p,q){
  var d=num(p.dosis);if(d===''||!q)return 0;
  switch(p.unidad){case 'L/ha':return d*1000/q;case 'ml/ha':return d/q;case 'kg/ha':return d*1000/q;case 'g/ha':return d/q;case 'ml/100L':return d/100;case '%v/v':return d*10;}
  return 0;
}
function calcular(A){
  var ha=num(A.ha),q=num(A.caudal),cap=capMixer(A),tq=num(A.tanque),sob=num(A.sob)||0,rend=num(A.rend);
  var falta=[];if(!ha)falta.push('hectáreas');if(!q)falta.push('caudal');if(!cap)falta.push('capacidad del mixer');
  if(falta.length)return {falta:falta};
  var total=ha*q*(1+sob/100),lotes=[];
  if(A.modo==='iguales'){var n=Math.ceil(total/cap-1e-9);lotes.push({vol:total/n,cant:n});}
  else{var nf=Math.floor(total/cap+1e-9),r=total-nf*cap;if(nf)lotes.push({vol:cap,cant:nf});if(r>0.05)lotes.push({vol:r,cant:1});}
  var P=A.prods.map(function(p,i){return {p:p,i:i,c:concL(p,q),sol:esSolido(p.unidad)};}).filter(function(x){return x.p.nombre.trim()||num(x.p.dosis)!=='';});
  P.forEach(function(x){x.total=x.c*total;var e=num(x.p.envase);if(e){var tot=x.total/1000;x.envases=Math.ceil(tot/e-1e-9);x.sobraEnv=x.envases*e-tot;}});
  var orden=P.slice().sort(function(a,b){return tipoOrden(a.p.tipo)-tipoOrden(b.p.tipo)||a.i-b.i;});
  var volProdL=P.reduce(function(s,x){return s+x.c;},0)/1000; // L de producto por L de caldo (sólidos ~1 kg = 1 L)
  var ini=1;
  lotes.forEach(function(l){l.desde=ini;l.hasta=ini+l.cant-1;ini+=l.cant;l.ha=l.vol/q/(1+sob/100);l.prodVol=volProdL*l.vol;l.cargas=tq?l.vol/tq:'';});
  var nMix=lotes.reduce(function(s,l){return s+l.cant;},0);
  return {ha:ha,q:q,cap:cap,tq:tq,sob:sob,total:total,lotes:lotes,P:P,orden:orden,nMix:nMix,share:volProdL,cargas:tq?total/tq:'',horas:rend?ha/rend:'',haMix:cap/q/(1+sob/100)};
}

/* ================= FORMULARIO ================= */
function A(){return D.actual;}
function pintarForm(){
  var a=A();
  $('f-lote').value=a.lote;$('f-cultivo').value=a.cultivo;$('f-fecha').value=a.fecha;$('f-obj').value=a.obj||'';
  $('f-ha').value=a.ha;$('f-caudal').value=a.caudal;$('f-mixer-otro').value=a.mixerOtro;$('f-tanque').value=a.tanque;$('f-sob').value=a.sob;$('f-rend').value=a.rend;
  pintarEquipos();pintarModo();pintarProds();
}
function pintarEquipos(){
  var a=A();
  $('f-equipos').innerHTML=D.cfg.equipos.map(function(e){return '<button class="chip'+(a.equipo===e.id?' on':'')+'" onclick="setEquipo(\''+e.id+'\')">'+esc(e.nombre)+'</button>';}).join('')+
    '<button class="chip'+(a.equipo==='otro'?' on':'')+'" onclick="setEquipo(\'otro\')">Otro</button>';
  $('f-otro-box').style.display=a.equipo==='otro'?'flex':'none';
}
function setEquipo(id){var a=A();a.equipo=id;var e=equipoSel(a);if(e&&e.tanque){a.tanque=e.tanque;$('f-tanque').value=e.tanque;}a.hechos=[];pintarEquipos();guardar();render();}
function setModo(m){A().modo=m;A().hechos=[];pintarModo();guardar();render();}
function pintarModo(){[].forEach.call($('f-modo').children,function(b){b.classList.toggle('on',b.dataset.m===A().modo);});}
function pintarProds(){
  $('f-prods').innerHTML=A().prods.map(function(p,i){
    return '<div class="prod"><div class="top"><span class="num">'+(i+1)+'</span>'+
      '<div class="field"><label>Producto</label><input list="dl-prods" value="'+esc(p.nombre)+'" placeholder="Nombre comercial" oninput="setP('+i+',\'nombre\',this.value)" onchange="desdeLib('+i+',this.value)"></div>'+
      '<button class="x" title="Quitar" onclick="delProd('+i+')">&#10005;</button></div>'+
      '<div class="g2"><div class="field"><label>Dosis</label><input inputmode="decimal" value="'+esc(p.dosis)+'" placeholder="0" style="font-family:var(--mono);font-weight:800" oninput="setP('+i+',\'dosis\',this.value)"></div>'+
      '<div class="field"><label>Unidad</label><select onchange="setP('+i+',\'unidad\',this.value);pintarProds()">'+opts(UNIDADES,p.unidad)+'</select></div></div>'+
      '<div class="g2"><div class="field"><label>Formulación (orden de carga)</label><select onchange="setP('+i+',\'tipo\',this.value)">'+opts(TIPOS.map(function(t){return [t[0],t[1]];}),p.tipo)+'</select></div>'+
      '<div class="field"><label>Envase ('+(esSolido(p.unidad)?'kg':'L')+') opcional</label><input inputmode="decimal" value="'+esc(p.envase)+'" placeholder="Ej: 20" oninput="setP('+i+',\'envase\',this.value)"></div></div></div>';
  }).join('');
  $('dl-prods').innerHTML=D.lib.map(function(l){return '<option value="'+esc(l.nombre)+'">';}).join('');
}
function setP(i,k,v){A().prods[i][k]=v;guardar();render();}
function addProd(){A().prods.push(nuevoProd());guardar();pintarProds();render();var ins=$('f-prods').querySelectorAll('.prod');var last=ins[ins.length-1];if(last)last.querySelector('input').focus();}
function delProd(i){A().prods.splice(i,1);if(!A().prods.length)A().prods.push(nuevoProd());guardar();pintarProds();render();}
function desdeLib(i,nombre){
  var l=D.lib.find(function(x){return x.nombre.toLowerCase()===String(nombre).trim().toLowerCase();});if(!l)return;
  var p=A().prods[i];p.nombre=l.nombre;if(p.dosis==='')p.dosis=l.dosis;p.unidad=l.unidad;p.tipo=l.tipo;if(!p.envase)p.envase=l.envase||'';
  guardar();setTimeout(function(){pintarProds();render();},0);toast('Datos de '+l.nombre+' cargados');
}
function cambio(){
  var a=A();a.lote=$('f-lote').value;a.cultivo=$('f-cultivo').value;a.fecha=$('f-fecha').value;a.obj=$('f-obj').value;
  var prev=[a.ha,a.caudal,a.mixerOtro,a.sob].join('|');
  a.ha=$('f-ha').value;a.caudal=$('f-caudal').value;a.mixerOtro=$('f-mixer-otro').value;a.tanque=$('f-tanque').value;a.sob=$('f-sob').value;a.rend=$('f-rend').value;
  if(prev!==[a.ha,a.caudal,a.mixerOtro,a.sob].join('|'))a.hechos=[];
  guardar();render();
}

/* ================= RESULTADO ================= */
function render(){
  var a=A(),R=calcular(a),h='';
  if(R.falta){$('resultado').innerHTML='<div class="aviso info">Completá '+R.falta.join(', ')+' para ver la mezcla.</div>';return;}
  var av=[];
  if(R.q<5||R.q>40)av.push(['warn','Caudal de '+fAuto(R.q)+' L/ha: es inusual para drone (lo habitual es 8 a 30 L/ha). Revisá el dato.']);
  if(R.share>0.25)av.push(['warn','Los productos ocupan cerca del '+Math.round(R.share*100)+'% del caldo. Revisá compatibilidad y que la mezcla no quede demasiado concentrada (prueba de la jarra).']);
  if(R.share>=1)av.push(['err','Los productos superan el volumen del caldo: subí el caudal o revisá las dosis.']);
  if(!R.P.length)av.push(['info','Agregá los productos con su dosis para ver las cantidades por mixer.']);
  var sinDosis=R.P.filter(function(x){return num(x.p.dosis)==='';});if(sinDosis.length)av.push(['warn','Falta la dosis de: '+sinDosis.map(function(x){return esc(x.p.nombre||'producto');}).join(', ')+'.']);
  h+=av.map(function(x){return '<div class="aviso '+x[0]+'">'+x[1]+'</div>';}).join('');
  h+='<div class="kpis"><div class="kpi"><div class="v">'+fN(R.total,0)+'</div><div class="l">Litros de caldo</div></div>'+
     '<div class="kpi"><div class="v">'+R.nMix+'</div><div class="l">Mixers de '+fN(R.cap,0)+' L</div></div>'+
     '<div class="kpi"><div class="v">'+fAuto(R.haMix)+'</div><div class="l">Ha por mixer lleno</div></div>'+
     (R.cargas!==''?'<div class="kpi"><div class="v">'+Math.ceil(R.cargas-1e-9)+'</div><div class="l">Cargas del drone ('+fN(R.tq,0)+' L)</div></div>':'')+
     (R.horas!==''?'<div class="kpi"><div class="v">'+fN(R.horas,1)+'</div><div class="l">Horas estimadas</div></div>':'')+'</div>';
  if(R.P.length){
    h+='<div class="card"><h3>Total del trabajo (para el depósito)</h3><div class="tw" style="margin:0"><table><thead><tr><th>Producto</th><th>Dosis</th><th style="text-align:right">Total</th><th style="text-align:right">Envases</th></tr></thead><tbody>'+
      R.P.map(function(x){return '<tr><td><b>'+esc(x.p.nombre||'Producto '+(x.i+1))+'</b></td><td class="muted">'+esc(x.p.dosis)+' '+esc(x.p.unidad)+'</td><td class="n">'+fCant(x.total,x.sol)+'</td><td class="n">'+(x.envases?x.envases+' × '+fN(num(x.p.envase),num(x.p.envase)%1?1:0)+(x.sol?' kg':' L'):'-')+'</td></tr>';}).join('')+
      '</tbody></table></div>'+(R.sob?'<p class="muted" style="margin-top:6px">Incluye '+fAuto(R.sob)+'% de sobrante.</p>':'')+'</div>';
  }
  var hechos=a.hechos||[];
  R.lotes.forEach(function(l){
    var tit=l.cant>1?'Mixers '+l.desde+' al '+l.hasta+' — '+fN(l.vol,l.vol%1?1:0)+' L cada uno':'Mixer '+l.desde+(R.lotes.length>1||R.nMix>1?' (último)':'')+' — '+fN(l.vol,l.vol%1?1:0)+' L';
    var pasos='<div class="paso agua"><span class="o">1</span><div class="t"><b>Agua inicial</b><small>Cargá cerca de la mitad y prendé la agitación</small></div><span class="q">≈'+fN(Math.round(l.vol*0.5/5)*5||l.vol*0.5,0)+' L</span></div>';
    R.orden.forEach(function(x,k){pasos+='<div class="paso"><span class="o">'+(k+2)+'</span><div class="t"><b>'+esc(x.p.nombre||'Producto '+(x.i+1))+'</b><small>'+esc(tipoTxt(x.p.tipo))+' · '+esc(x.p.dosis)+' '+esc(x.p.unidad)+'</small></div><span class="q">'+fCant(x.c*l.vol,x.sol)+'</span></div>';});
    pasos+='<div class="paso agua"><span class="o">'+(R.orden.length+2)+'</span><div class="t"><b>Completar con agua</b><small>Hasta la marca, con agitación'+(l.prodVol>0?' · agua ≈ '+fN(Math.max(0,l.vol-l.prodVol),0)+' L':'')+'</small></div><span class="q">'+fN(l.vol,l.vol%1?1:0)+' L</span></div>';
    var prog='';for(var m=l.desde;m<=l.hasta;m++)prog+='<button class="mx'+(hechos.indexOf(m)>=0?' done':'')+'" onclick="toggleMix('+m+')">'+m+'</button>';
    h+='<div class="hoja"><h4>'+tit+'</h4><div class="sub">Cubre '+fAuto(l.ha)+' ha'+(l.cargas!==''?' · ≈ '+fN(l.cargas,1)+' cargas de drone de '+fN(R.tq,0)+' L':'')+'</div>'+pasos+
      (R.lotes.length||R.nMix?'<div class="prog"><span>Tocá cada mixer al terminarlo:</span>'+prog+'</div>':'')+'</div>';
  });
  var ok=hechos.length;h+='<p class="muted" style="margin-bottom:12px">'+(ok?'Preparados: '+ok+' de '+R.nMix+' mixers. ':'')+'Orden de carga sugerido según formulación. Respetá siempre la etiqueta y hacé la prueba de la jarra con mezclas nuevas.</p>';
  $('resultado').innerHTML=h;
  $('print-head').innerHTML='<h2>Mezcla '+esc(a.lote||'')+'</h2><p>'+esc([a.cultivo,a.obj,isoAR(a.fecha),D.cfg.empresa].filter(Boolean).join(' · '))+' · '+fAuto(R.ha)+' ha · '+fAuto(R.q)+' L/ha</p>';
}
function toggleMix(m){var h=A().hechos||(A().hechos=[]),i=h.indexOf(m);if(i>=0)h.splice(i,1);else h.push(m);guardar();render();var R=calcular(A());if(!R.falta&&h.length===R.nMix)toast('¡Todos los mixers preparados!');}

/* ================= TEXTO PARA COMPARTIR ================= */
function texto(){
  var a=A(),R=calcular(a);if(R.falta)return '';
  var t=['*MEZCLA DRONE*'+(a.lote?' – '+a.lote:'')];
  var info=[a.cultivo,a.obj,isoAR(a.fecha)].filter(Boolean).join(' · ');if(info)t.push(info);
  t.push(fAuto(R.ha)+' ha · '+fAuto(R.q)+' L/ha · caldo total '+fN(R.total,0)+' L'+(R.sob?' (incl. '+fAuto(R.sob)+'% sobrante)':''));
  t.push('Mixer de '+fN(R.cap,0)+' L: '+R.lotes.map(function(l){return l.cant+' × '+fN(l.vol,l.vol%1?1:0)+' L';}).join(' + ')+(R.cargas!==''?' · ≈'+Math.ceil(R.cargas-1e-9)+' cargas de drone':''));
  R.lotes.forEach(function(l){
    t.push('');t.push('*'+(l.cant>1?'Mixers '+l.desde+'-'+l.hasta+' ('+fN(l.vol,l.vol%1?1:0)+' L c/u)':'Mixer '+l.desde+' ('+fN(l.vol,l.vol%1?1:0)+' L)')+'* – '+fAuto(l.ha)+' ha');
    t.push('1. Agua ≈'+fN(Math.round(l.vol*0.5/5)*5||l.vol*0.5,0)+' L + agitación');
    R.orden.forEach(function(x,k){t.push((k+2)+'. '+(x.p.nombre||'Producto')+': '+fCant(x.c*l.vol,x.sol));});
    t.push((R.orden.length+2)+'. Completar con agua hasta '+fN(l.vol,l.vol%1?1:0)+' L');
  });
  if(R.P.length){t.push('');t.push('*Total productos*');R.P.forEach(function(x){t.push('• '+(x.p.nombre||'Producto')+' ('+x.p.dosis+' '+x.p.unidad+'): '+fCant(x.total,x.sol)+(x.envases?' → '+x.envases+' envase'+(x.envases>1?'s':'')+' de '+x.p.envase+(x.sol?' kg':' L'):''));});}
  if(D.cfg.empresa){t.push('');t.push('_'+D.cfg.empresa+'_');}
  return t.join('\n');
}
function compartir(){var s=texto();if(!s){toast('Completá los datos primero',1);return;}
  window.open('https://wa.me/?text='+encodeURIComponent(s),'_blank');}
function copiar(){var s=texto();if(!s){toast('Completá los datos primero',1);return;}
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast('Texto copiado');},function(){var ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Texto copiado');}catch(e){toast('No se pudo copiar',1);}ta.remove();});}

/* ================= TRABAJOS Y BIBLIOTECA ================= */
function aLib(){
  A().prods.forEach(function(p){var n=p.nombre.trim();if(!n||num(p.dosis)==='')return;
    var l=D.lib.find(function(x){return x.nombre.toLowerCase()===n.toLowerCase();});
    var d={nombre:n,dosis:p.dosis,unidad:p.unidad,tipo:p.tipo,envase:p.envase};if(l)Object.assign(l,d);else D.lib.push(d);});
  D.lib.sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
}
function guardarTrabajo(){
  var a=A(),R=calcular(a);if(R.falta){toast('Completá '+R.falta[0],1);return;}
  aLib();var copia=JSON.parse(JSON.stringify(a));
  if(a.id){var i=D.trabajos.findIndex(function(t){return t.id===a.id;});if(i>=0)D.trabajos[i]=copia;else D.trabajos.unshift(copia);}
  else{a.id=copia.id='T'+(D.seq++);D.trabajos.unshift(copia);}
  guardar();pintarProds();toast('Trabajo guardado');
}
function nuevo(){if(!confirm('Empezar un cálculo nuevo? (el actual se pierde si no lo guardaste)'))return;var keepEq=A().equipo,keepTq=A().tanque,keepQ=A().caudal;D.actual=nuevoDraft();D.actual.equipo=keepEq;D.actual.tanque=keepTq;D.actual.caudal=keepQ;D.actual.sob=D.cfg.sob||'';guardar();pintarForm();render();window.scrollTo(0,0);}
function rTrab(){
  $('s-trab').innerHTML=D.trabajos.length?D.trabajos.map(function(t,i){var R=calcular(t);
    return '<div class="vcard"><div class="t">'+esc(t.lote||'Sin nombre')+(t.cultivo?' · '+esc(t.cultivo):'')+'</div><div class="d">'+isoAR(t.fecha)+(R.falta?'':' · '+fAuto(R.ha)+' ha · '+fAuto(R.q)+' L/ha · '+R.nMix+' mixers de '+fN(R.cap,0)+' L')+'<br>'+esc(t.prods.filter(function(p){return p.nombre;}).map(function(p){return p.nombre+' '+p.dosis+' '+p.unidad;}).join(' · '))+'</div>'+
      '<div class="btns"><button class="btn" onclick="abrirT('+i+',false)">Abrir</button><button class="btn sec" onclick="abrirT('+i+',true)">Duplicar</button><button class="btn sec" style="color:var(--danger)" onclick="borrarT('+i+')">Borrar</button></div></div>';}).join('')
    :'<div class="aviso info">Todavía no guardaste trabajos. Desde <b>Calcular</b>, tocá "Guardar trabajo".</div>';
}
function abrirT(i,dup){var t=JSON.parse(JSON.stringify(D.trabajos[i]));if(dup){delete t.id;t.fecha=hoy();t.hechos=[];t.lote=t.lote?t.lote+' (copia)':'';}D.actual=t;guardar();ir('calc');pintarForm();render();toast(dup?'Trabajo duplicado: ajustá lo que cambie':'Trabajo abierto');}
function borrarT(i){if(!confirm('Borrar este trabajo?'))return;D.trabajos.splice(i,1);guardar();rTrab();}
function rProd(){
  $('s-prod').innerHTML='<p class="muted" style="margin-bottom:10px">Los productos se guardan solos al guardar un trabajo. Al escribir el nombre en Calcular, se completan dosis, unidad, formulación y envase.</p>'+
    (D.lib.length?'<div class="tw"><table><thead><tr><th>Producto</th><th>Dosis</th><th>Formulación</th><th>Envase</th><th></th></tr></thead><tbody>'+
    D.lib.map(function(l,i){return '<tr><td><b>'+esc(l.nombre)+'</b></td><td>'+esc(l.dosis)+' '+esc(l.unidad)+'</td><td class="muted">'+esc(tipoTxt(l.tipo))+'</td><td>'+(l.envase?esc(l.envase)+(esSolido(l.unidad)?' kg':' L'):'-')+'</td><td><button class="x" onclick="if(confirm(\'Quitar de la lista?\')){D.lib.splice('+i+',1);guardar();rProd()}">&#10005;</button></td></tr>';}).join('')+'</tbody></table></div>'
    :'<div class="aviso info">Todavía no hay productos guardados.</div>');
}

/* ================= AJUSTES ================= */
function rCfg(){
  $('s-cfg').innerHTML='<div class="card"><h3>Empresa</h3><div class="field"><label>Nombre (aparece en lo que compartís)</label><input id="c-emp" value="'+esc(D.cfg.empresa)+'"></div>'+
    '<div class="field"><label>Sobrante por defecto (%)</label><input id="c-sob" inputmode="decimal" value="'+esc(D.cfg.sob||'')+'" placeholder="0"></div></div>'+
    '<div class="card"><h3>Equipos</h3>'+D.cfg.equipos.map(function(e,i){return '<div class="g3"><div class="field"><label>Nombre</label><input id="c-en'+i+'" value="'+esc(e.nombre)+'"></div><div class="field"><label>Mixer (L)</label><input id="c-em'+i+'" inputmode="decimal" value="'+esc(e.mixer)+'"></div><div class="field"><label>Tanque drone (L)</label><input id="c-et'+i+'" inputmode="decimal" value="'+esc(e.tanque)+'"></div></div>';}).join('')+
    '<div class="btns"><button class="btn sec" onclick="addEq()">+ Agregar equipo</button>'+(D.cfg.equipos.length>1?'<button class="btn sec" onclick="delEq()">Quitar el último</button>':'')+'</div></div>'+
    '<button class="btn ok full" style="margin-bottom:12px" onclick="guardarCfg()">Guardar ajustes</button>'+
    '<div class="card"><h3>Respaldo</h3><p class="muted" style="margin-bottom:10px">Trabajos, productos y ajustes se guardan solo en este dispositivo. Descargá un respaldo para pasarlos a otro celular.</p>'+
    '<div class="btns"><button class="btn ok" onclick="respaldo()">Descargar respaldo</button><button class="btn sec" onclick="$(\'file-restore\').click()">Restaurar</button></div></div>';
}
function leerCfg(){D.cfg.empresa=$('c-emp').value.trim();D.cfg.sob=num($('c-sob').value)||0;D.cfg.equipos.forEach(function(e,i){e.nombre=$('c-en'+i).value.trim()||('Equipo '+(i+1));e.mixer=num($('c-em'+i).value)||e.mixer;e.tanque=num($('c-et'+i).value)||'';});}
function guardarCfg(){leerCfg();guardar();pintarEquipos();render();pintarSub();toast('Ajustes guardados');}
function addEq(){leerCfg();D.cfg.equipos.push({id:'e'+Date.now(),nombre:'Equipo '+(D.cfg.equipos.length+1),mixer:400,tanque:40});guardar();rCfg();}
function delEq(){leerCfg();var e=D.cfg.equipos.pop();if(A().equipo===e.id)A().equipo=D.cfg.equipos[0].id;guardar();rCfg();pintarEquipos();render();}
function respaldo(){var b=new Blob([JSON.stringify({app:'mezclas_drone',fecha:new Date().toISOString(),db:D})],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_mezclas_'+hoy().replace(/-/g,'')+'.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);toast('Respaldo descargado');}
function restaurar(inp){var f=inp.files[0];inp.value='';if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result),d=o.db||o;if(!d.cfg||!Array.isArray(d.trabajos))throw 0;
  if(!confirm('Restaurar respaldo con '+d.trabajos.length+' trabajos? Reemplaza los datos actuales.'))return;var b=base();for(var k in d)b[k]=d[k];D=b;if(!D.actual)D.actual=nuevoDraft();guardar();aplicarTema();pintarForm();render();pintarSub();ir('calc');toast('Respaldo restaurado');}catch(e){toast('Archivo no válido',1);}};r.readAsText(f);}

/* ================= NAVEGACIÓN, TEMA, PWA ================= */
function ir(s){document.querySelectorAll('main section').forEach(function(x){x.classList.toggle('on',x.id==='s-'+s);});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.s===s);});
  if(s==='trab')rTrab();if(s==='prod')rProd();if(s==='cfg')rCfg();window.scrollTo(0,0);}
function pintarSub(){$('h-sub').textContent=D.cfg.empresa||'Calculadora de caldo por mixer';}
function aplicarTema(){document.body.classList.toggle('oscuro',D.tema==='oscuro');$('btn-tema').textContent=D.tema==='oscuro'?'☀️ Claro':'🌙 Oscuro';}
function toggleTema(){D.tema=D.tema==='oscuro'?'claro':'oscuro';guardar();aplicarTema();}
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator){
  var _hab=!!navigator.serviceWorker.controller,_rec=false;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(_rec||!_hab)return;_rec=true;location.reload();});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
}
cargar();aplicarTema();pintarSub();if(!A().tanque){var _e=equipoSel(A());if(_e)A().tanque=_e.tanque;}pintarForm();render();
</script>
</body>
</html>
